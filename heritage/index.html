<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>国保足迹 - 全国重点文物保护单位到访记录</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./data/runtime.js" defer></script>
  <script src="./data/units.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">第一至第八批</p>
      <h1>国保足迹</h1>
    </div>
    <div class="header-actions">
      <nav class="view-nav" aria-label="页面导航">
        <a class="button secondary" id="recordsViewLink" href="./index.html">名录与记录</a>
        <a class="button secondary" id="statisticsViewLink" href="./index.html?view=stats">到访统计</a>
      </nav>
      <details class="data-menu">
        <summary class="button secondary">数据</summary>
        <div class="data-menu-popover" aria-label="数据操作">
          <button id="importButton" type="button" title="从此前备份的 JSON 恢复到访记录">导入备份</button>
          <button id="exportJsonButton" type="button" title="将浏览器中的到访时间和备注保存为 JSON">备份记录</button>
          <button id="exportCsvButton" type="button" title="将当前筛选结果导出为可用 Excel 打开的表格">导出当前 CSV</button>
        </div>
      </details>
      <a class="button secondary" id="blogHomeLink" href="https://kangaroogao.com/" hidden>返回主页</a>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main id="statisticsView" class="page-view" hidden>
    <section class="stats-band" aria-label="到访概况">
      <div class="stat">
        <span class="stat-label">独立国保</span>
        <strong id="totalStat">5,058</strong>
      </div>
      <div class="stat">
        <span class="stat-label">已到访</span>
        <strong id="visitedStat">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">到访省份</span>
        <strong id="provinceStat">0</strong>
      </div>
      <div class="stat">
        <span class="stat-label">完成度</span>
        <strong id="rateStat">0.0%</strong>
      </div>
    </section>

    <section class="analytics-band" aria-labelledby="analyticsTitle">
      <div class="analytics-heading">
        <div>
          <p class="eyebrow">个人到访数据</p>
          <h2 id="analyticsTitle">到访统计</h2>
        </div>
        <p id="timeCoverage" class="analytics-summary"></p>
      </div>
      <div class="analytics-grid">
        <article class="chart-panel timeline-panel">
          <div class="chart-heading">
            <h3>到访趋势</h3>
            <div class="segmented compact" id="timelineControl" aria-label="趋势统计精度">
              <button type="button" class="active" data-granularity="year">按年</button>
              <button type="button" data-granularity="month">按月</button>
            </div>
          </div>
          <div class="chart-scroll">
            <div id="timelineChart" class="timeline-chart" role="img" aria-label="到访趋势图"></div>
          </div>
        </article>

        <article class="chart-panel">
          <div class="chart-heading">
            <h3>各批完成度</h3>
          </div>
          <div id="batchChart" class="horizontal-chart" role="img" aria-label="各批全国重点文物保护单位完成度"></div>
        </article>

        <article class="chart-panel">
          <div class="chart-heading">
            <h3>到访类别</h3>
          </div>
          <div id="categoryChart" class="horizontal-chart" role="img" aria-label="已到访单位类别分布"></div>
        </article>
      </div>
    </section>

    <section class="statistics-provinces" aria-labelledby="provinceProgressTitle">
      <div class="analytics-heading">
        <div>
          <p class="eyebrow">区域完成度</p>
          <h2 id="provinceProgressTitle">省份进度</h2>
        </div>
        <p class="analytics-summary">选择省份可返回名录继续标记</p>
      </div>
      <div id="provinceProgress" class="province-progress-grid"></div>
    </section>
  </main>

  <main id="recordsView" class="page-view">
    <section class="control-band" aria-label="筛选和视图">
      <label class="search-field">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="名称、编号、地址、年代" autocomplete="off">
      </label>
      <div class="segmented" id="statusControl" aria-label="到访状态">
        <button type="button" data-status="all">全部</button>
        <button type="button" class="active" data-status="visited">已到访</button>
        <button type="button" data-status="unvisited">未到访</button>
      </div>
      <div class="segmented" id="groupControl" aria-label="分组方式">
        <button type="button" class="active" data-group="province">按省份</button>
        <button type="button" data-group="batch">按批次</button>
        <button type="button" data-group="period">按年代</button>
      </div>
    </section>

    <div class="workspace">
      <aside class="filters" aria-label="筛选条件">
        <div class="filter-section">
          <div class="filter-heading">
            <span>批次</span>
            <button id="allBatchesButton" class="text-button" type="button">全部</button>
          </div>
          <div class="batch-grid" id="batchFilters"></div>
        </div>

        <label class="filter-section field-label">
          <span>省份</span>
          <select id="provinceFilter"></select>
        </label>

        <label class="filter-section field-label">
          <span>类别</span>
          <select id="categoryFilter"></select>
        </label>

        <label class="filter-section field-label">
          <span>年代</span>
          <select id="periodFilter"></select>
        </label>

        <label class="filter-section toggle-row">
          <span>
            <strong>并入项目</strong>
            <small>另计 238 项</small>
          </span>
          <input id="mergedToggle" type="checkbox" role="switch">
        </label>

        <button id="resetFiltersButton" class="button secondary full-width" type="button">重置筛选</button>
      </aside>

      <section class="results" aria-label="文物保护单位列表">
        <div class="result-toolbar">
          <p id="resultCount" aria-live="polite"></p>
          <div class="result-page-tools">
            <label>
              每页
              <select id="pageSizeSelect">
                <option value="20" selected>20</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </label>
            <button id="previousPageButton" class="page-step" type="button" aria-label="上一页" title="上一页">‹</button>
            <span id="pageIndicator" class="page-indicator">1 / 1</span>
            <button id="nextPageButton" class="page-step" type="button" aria-label="下一页" title="下一页">›</button>
            <label class="page-jump">
              前往
              <input id="pageJumpInput" type="number" min="1" step="1" inputmode="numeric" aria-label="跳转页码">
              页
            </label>
            <button id="pageJumpButton" class="button secondary page-jump-button" type="button">跳转</button>
          </div>
        </div>

        <div id="resultGroups"></div>
        <nav class="pagination" id="pagination" aria-label="翻页"></nav>
      </section>
    </div>
  </main>

  <dialog id="detailDialog" class="detail-dialog">
    <form method="dialog" id="detailForm">
      <div class="dialog-header">
        <div>
          <p id="dialogMeta" class="eyebrow"></p>
          <h2 id="dialogTitle"></h2>
        </div>
        <button class="close-button" value="cancel" aria-label="关闭" title="关闭" type="submit">×</button>
      </div>
      <div class="dialog-facts" id="dialogFacts"></div>
      <label class="toggle-row dialog-visited">
        <span><strong>已到访</strong></span>
        <input id="dialogVisited" type="checkbox" role="switch">
      </label>
      <label class="field-label">
        <span>到访时间</span>
        <input id="dialogTime" type="text" placeholder="2024 / 2024-05 / 2024-05-18">
      </label>
      <label class="field-label">
        <span>备注</span>
        <textarea id="dialogNotes" rows="4" placeholder="行程、同行者、开放情况等"></textarea>
      </label>
      <div class="dialog-actions">
        <a id="dialogSource" class="source-link" target="_blank" rel="noreferrer">查看名单来源</a>
        <button class="button primary" id="saveDetailButton" value="default" type="submit">保存记录</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer>
    <span>数据口径：独立国保 5,058 处，另收录并入项目 238 项。</span>
    <span id="saveStatus" class="save-status"></span>
    <button id="clearRecordsButton" class="text-button danger" type="button">清空个人记录</button>
  </footer>
</body>
</html>
